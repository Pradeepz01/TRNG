# Tiny Tapeout project information
project:
  title:        "True Random Number Generator (TRNG)"
  author:       "Pradeep"
  discord:      ""
  description:  "Hardware TRNG with 8 prime-staggered ring oscillators, von neumann debiaser, and health watchdog"
  language:     "Verilog"
  clock_hz:     100000000       # 100 MHz target clock

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name:
  top_module:  "tt_um_trng"

  # List your project's source files here:
  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "enable"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "random_data[0]"
  uo[1]: "random_data[1]"
  uo[2]: "random_data[2]"
  uo[3]: "random_data[3]"
  uo[4]: "random_data[4]"
  uo[5]: "random_data[5]"
  uo[6]: "random_data[6]"
  uo[7]: "random_data[7]"

  # Bidirectional pins
  uio[0]: "byte_valid"
  uio[1]: "healthy"
  uio[2]: "entropy_mon"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
